<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <header class="page-header">
        <h1>Anime</h1>
        <p>From epic adventures to quiet slice-of-life stories.</p>
      </header>
      <p class="results-count" id="results-count"></p>
      <div class="card-grid" id="grid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var results = window.CinevaData.getTitlesByType("anime").sort(function (a, b) { return b.popularity - a.popularity; });
    document.getElementById("results-count").textContent = results.length + " titles";
    window.CinevaComponents.renderCardGrid(document.getElementById("grid"), results);
  </script>
</body>
</html>
