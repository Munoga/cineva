<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies – Cineva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <header class="page-header">
        <h1>Movies</h1>
        <p>Browse our complete collection of films across every genre.</p>
      </header>
      <div class="filter-bar" id="filter-bar">
        <div class="filter-group">
          <label for="f-genre">Genre</label>
          <select id="f-genre">
            <option value="all">All genres</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="popularity">Popularity</option>
            <option value="rating">Highest rated</option>
            <option value="newest">Newest</option>
            <option value="title">A–Z</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="f-rating">Min rating</label>
          <select id="f-rating">
            <option value="0">Any</option>
            <option value="7">7+</option>
            <option value="8">8+</option>
            <option value="8.5">8.5+</option>
          </select>
        </div>
        <div class="filter-actions">
          <button type="button" class="btn btn-secondary btn-sm" id="clear-filters">Clear</button>
        </div>
      </div>
      <p class="results-count" id="results-count"></p>
      <div class="card-grid" id="grid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var D = window.CinevaData;
    var C = window.CinevaComponents;
    var genreSelect = document.getElementById("f-genre");
    D.GENRES.forEach(function (g) {
      var opt = document.createElement("option");
      opt.value = g.id;
      opt.textContent = g.name;
      genreSelect.appendChild(opt);
    });
    function apply() {
      var results = D.filterTitles({
        type: "movie",
        genre: genreSelect.value,
        sort: document.getElementById("f-sort").value,
        minRating: document.getElementById("f-rating").value
      });
      document.getElementById("results-count").textContent = results.length + " movie" + (results.length === 1 ? "" : "s");
      C.renderCardGrid(document.getElementById("grid"), results);
    }
    genreSelect.addEventListener("change", apply);
    document.getElementById("f-sort").addEventListener("change", apply);
    document.getElementById("f-rating").addEventListener("change", apply);
    document.getElementById("clear-filters").addEventListener("click", function () {
      genreSelect.value = "all";
      document.getElementById("f-sort").value = "popularity";
      document.getElementById("f-rating").value = "0";
      apply();
    });
    apply();
  </script>
</body>
</html>
