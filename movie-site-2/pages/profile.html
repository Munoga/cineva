<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <style>
    .profile-layout { display: grid; gap: 24px; padding: 32px 0 48px; }
    @media (min-width: 900px) {
      .profile-layout { grid-template-columns: 260px 1fr; align-items: start; }
    }
    .profile-side {
      background: var(--color-bg-elevated, #171717); border: 1px solid var(--color-border, #333);
      border-radius: 12px; padding: 24px; text-align: center;
    }
    .profile-avatar-lg {
      width: 88px; height: 88px; border-radius: 50%; margin: 0 auto 14px;
      background: linear-gradient(135deg, #FF0000, #991b1b); display: grid; place-items: center;
      font-size: 2rem; font-weight: 700; color: #fff;
    }
    .profile-side h1 { font-size: 1.2rem; margin: 0 0 4px; }
    .profile-side .email { font-size: 0.85rem; color: var(--color-text-secondary, #a3a3a3); margin-bottom: 16px; word-break: break-all; }
    .profile-side .meta { font-size: 0.75rem; color: var(--color-text-muted, #737373); margin-bottom: 20px; }
    .profile-nav { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .profile-nav a, .profile-nav button {
      display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 500; color: var(--color-text-secondary, #a3a3a3);
      background: transparent; border: 0; cursor: pointer; font: inherit;
    }
    .profile-nav a:hover, .profile-nav button:hover, .profile-nav a.active {
      background: var(--color-bg-surface, #262626); color: #fff;
    }
    .profile-main { display: flex; flex-direction: column; gap: 20px; }
    .profile-card {
      background: var(--color-bg-elevated, #171717); border: 1px solid var(--color-border, #333);
      border-radius: 12px; padding: 22px 24px;
    }
    .profile-card h2 { margin: 0 0 16px; font-size: 1.05rem; font-weight: 600; }
    .profile-card label { display: block; font-size: 0.8rem; font-weight: 500; margin-bottom: 6px; color: var(--color-text-secondary, #a3a3a3); }
    .profile-card input {
      width: 100%; max-width: 400px; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px; box-sizing: border-box;
      border: 1px solid var(--color-border, #404040); background: var(--color-bg, #0a0a0a); color: inherit; font: inherit;
    }
    .profile-card input:focus { outline: none; border-color: var(--color-accent, #FF0000); }
    .profile-card input:disabled { opacity: 0.7; cursor: not-allowed; }
    .form-msg { font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }
    .form-msg.ok { color: #4ade80; }
    .form-msg.err { color: #f87171; }
    .profile-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
    .profile-section-head h2 { margin: 0; }
    .mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .empty-mini { color: var(--color-text-muted, #737373); font-size: 0.9rem; padding: 12px 0; }
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
    .stat-box { background: var(--color-bg, #0a0a0a); border-radius: 8px; padding: 14px; text-align: center; border: 1px solid var(--color-border, #333); }
    .stat-box strong { display: block; font-size: 1.35rem; }
    .stat-box span { font-size: 0.75rem; color: var(--color-text-secondary, #a3a3a3); }
  </style>
</head>
<body>
  <div id="site-header"></div>
  <main class="container profile-layout" id="profile-root">
    <p style="padding:40px;color:var(--color-text-secondary)">Loading…</p>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var S = window.CinevaStorage;
    var D = window.CinevaData;
    var C = window.CinevaComponents;
    var root = document.getElementById("profile-root");

    if (!S.isSignedIn()) {
      location.href = "signin.html?msg=" + encodeURIComponent("Sign in to view your profile.") + "&next=profile.html";
    } else {
      render();
    }

    function render() {
      var user = S.getAuthUser();
      var favIds = S.getFavorites();
      var listIds = S.getMyList();
      var favs = favIds.map(function (id) { return D.getTitleById(id); }).filter(Boolean);
      var list = listIds.map(function (id) { return D.getTitleById(id); }).filter(Boolean);
      var initial = (user.name || "U").charAt(0).toUpperCase();
      var joined = user.createdAt ? new Date(user.createdAt).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";

      root.innerHTML =
        '<aside class="profile-side">' +
          '<div class="profile-avatar-lg">' + C.escapeHtml(initial) + '</div>' +
          '<h1>' + C.escapeHtml(user.name || "Member") + '</h1>' +
          '<div class="email">' + C.escapeHtml(user.email || "") + '</div>' +
          '<div class="meta">Member since ' + joined + '</div>' +
          '<nav class="profile-nav">' +
            '<a href="#account" class="active">Account</a>' +
            '<a href="#security">Security</a>' +
            '<a href="#watchlist">Watchlist</a>' +
            '<a href="#favourites">Favourites</a>' +
            '<a href="my-list.html">Full My List →</a>' +
            '<a href="favorites.html">Full Favourites →</a>' +
            '<button type="button" id="btn-signout">Sign out</button>' +
          '</nav>' +
        '</aside>' +
        '<div class="profile-main">' +
          '<div class="stats-row">' +
            '<div class="stat-box"><strong>' + list.length + '</strong><span>Watchlist</span></div>' +
            '<div class="stat-box"><strong>' + favs.length + '</strong><span>Favourites</span></div>' +
            '<div class="stat-box"><strong>' + (S.getHistory().length) + '</strong><span>Recently viewed</span></div>' +
          '</div>' +

          '<section class="profile-card" id="account">' +
            '<h2>Account details</h2>' +
            '<form id="profile-form">' +
              '<label for="pf-name">Display name</label>' +
              '<input id="pf-name" name="name" type="text" value="' + C.escapeHtml(user.name || "") + '" required>' +
              '<label for="pf-email">Email</label>' +
              '<input id="pf-email" type="email" value="' + C.escapeHtml(user.email || "") + '" disabled title="Email cannot be changed in this demo">' +
              '<button type="submit" class="btn btn-primary">Save changes</button>' +
              '<div class="form-msg" id="profile-msg"></div>' +
            '</form>' +
          '</section>' +

          '<section class="profile-card" id="security">' +
            '<h2>Change password</h2>' +
            '<form id="password-form">' +
              '<label for="pw-current">Current password</label>' +
              '<input id="pw-current" type="password" autocomplete="current-password" required>' +
              '<label for="pw-new">New password</label>' +
              '<input id="pw-new" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters">' +
              '<label for="pw-confirm">Confirm new password</label>' +
              '<input id="pw-confirm" type="password" autocomplete="new-password" required minlength="6">' +
              '<button type="submit" class="btn btn-secondary">Update password</button>' +
              '<div class="form-msg" id="password-msg"></div>' +
            '</form>' +
          '</section>' +

          '<section class="profile-card" id="watchlist">' +
            '<div class="profile-section-head">' +
              '<h2>Watchlist</h2>' +
              '<a href="my-list.html" class="btn btn-ghost btn-sm">View all</a>' +
            '</div>' +
            (list.length
              ? '<div class="mini-grid" id="wl-grid"></div>'
              : '<p class="empty-mini">Your watchlist is empty. Browse movies and add titles while signed in.</p>') +
          '</section>' +

          '<section class="profile-card" id="favourites">' +
            '<div class="profile-section-head">' +
              '<h2>Favourites</h2>' +
              '<a href="favorites.html" class="btn btn-ghost btn-sm">View all</a>' +
            '</div>' +
            (favs.length
              ? '<div class="mini-grid" id="fav-grid"></div>'
              : '<p class="empty-mini">No favourites yet.</p>') +
          '</section>' +
        '</div>';

      if (list.length) {
        var wg = document.getElementById("wl-grid");
        list.slice(0, 8).forEach(function (t) {
          var card = C.createMovieCard(t, {});
          // fix relative links on pages/
          card.querySelectorAll("a").forEach(function (a) {
            var h = a.getAttribute("href") || "";
            if (h.indexOf("pages/") === 0) a.setAttribute("href", h.replace("pages/", ""));
          });
          wg.appendChild(card);
        });
      }
      if (favs.length) {
        var fg = document.getElementById("fav-grid");
        favs.slice(0, 8).forEach(function (t) {
          var card = C.createMovieCard(t, {});
          card.querySelectorAll("a").forEach(function (a) {
            var h = a.getAttribute("href") || "";
            if (h.indexOf("pages/") === 0) a.setAttribute("href", h.replace("pages/", ""));
          });
          fg.appendChild(card);
        });
      }

      document.getElementById("btn-signout").addEventListener("click", function () {
        S.signOut();
        location.href = "../index.html";
      });

      document.getElementById("profile-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("pf-name").value;
        var res = S.updateProfile({ name: name });
        var msg = document.getElementById("profile-msg");
        if (res.ok) {
          msg.className = "form-msg ok";
          msg.textContent = "Profile updated.";
          if (window.CinevaApp.refreshProfileMenu) window.CinevaApp.refreshProfileMenu();
          setTimeout(render, 600);
        } else {
          msg.className = "form-msg err";
          msg.textContent = res.error || "Could not update.";
        }
      });

      document.getElementById("password-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var cur = document.getElementById("pw-current").value;
        var nw = document.getElementById("pw-new").value;
        var conf = document.getElementById("pw-confirm").value;
        var msg = document.getElementById("password-msg");
        if (nw !== conf) {
          msg.className = "form-msg err";
          msg.textContent = "New passwords do not match.";
          return;
        }
        var res = S.changePassword(cur, nw);
        if (res.ok) {
          msg.className = "form-msg ok";
          msg.textContent = "Password updated.";
          e.target.reset();
        } else {
          msg.className = "form-msg err";
          msg.textContent = res.error || "Could not change password.";
        }
      });
    }
  </script>
</body>
</html>
