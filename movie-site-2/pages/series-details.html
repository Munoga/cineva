<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Series – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page" id="main"><div id="details-root"></div></main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var D = window.CinevaData, S = window.CinevaStorage, C = window.CinevaComponents;
    var id = new URLSearchParams(location.search).get("id");
    var title = D.getTitleById(id);
    var root = document.getElementById("details-root");
    if (!title) {
      root.innerHTML = '<div class="container"><div class="not-found"><div class="code">404</div><h1>Title not found</h1><a href="../index.html" class="btn btn-primary">Home</a></div></div>';
    } else {
      C.recordView(title.id);
      document.title = title.title + " – Cineva";
      var inList = S.isInMyList(title.id), fav = S.isFavorite(title.id);
      var seasons = title.seasons || 1, episodes = title.episodes || [];
      function renderEpisodes(season) {
        var eps = episodes.filter(function (e) { return e.season === season; });
        if (!eps.length) return '<p class="text-muted">No episode data for this season.</p>';
        return eps.map(function (ep) {
          return '<div class="episode-item"><div class="episode-thumb" style="background:var(--color-bg-surface);display:flex;align-items:center;justify-content:center;color:var(--color-gray-600);font-size:var(--text-sm)">S' + ep.season + 'E' + ep.number + '</div>' +
            '<div class="episode-info"><h4>' + ep.number + '. ' + C.escapeHtml(ep.title) + '</h4><p>' + C.escapeHtml(ep.synopsis || "") + '</p>' +
            '<div class="episode-meta">' + (ep.runtime || title.runtime || "—") + ' min</div>' +
            '<a href="' + C.watchUrl(title, ep) + '" class="btn btn-primary btn-sm" style="margin-top:8px">' + C.icon("play") + ' Watch</a></div></div>';
        }).join("");
      }
      var seasonBtns = "";
      for (var s = 1; s <= seasons; s++) {
        seasonBtns += '<button type="button" class="season-btn ' + (s === 1 ? "is-active" : "") + '" data-season="' + s + '">Season ' + s + '</button>';
      }
      root.innerHTML =
        '<div class="details-hero"><div class="details-backdrop"><img src="' + title.backdrop + '" alt="" onerror="this.style.display=\'none\'"><div class="details-backdrop-overlay"></div></div>' +
        '<div class="container details-content"><div class="details-poster"><img src="' + title.poster + '" alt="" onerror="this.style.opacity=0.3"></div>' +
        '<div class="details-info"><h1>' + C.escapeHtml(title.title) + '</h1>' +
        '<div class="details-meta"><span>' + title.year + '</span><span>' + seasons + ' season' + (seasons > 1 ? "s" : "") + '</span><span>' + (title.ageRating || "") + '</span>' +
        '<span class="movie-card-rating">' + C.icon("star") + " " + title.rating.toFixed(1) + '</span></div>' +
        '<div class="tag-list" style="margin-bottom:var(--space-4)">' + title.genres.map(function(g){ return '<span class="badge">' + C.genreName(g) + '</span>'; }).join("") + '</div>' +
        '<p class="details-synopsis">' + C.escapeHtml(title.synopsis) + '</p>' +
        '<div class="details-actions"><a href="' + C.watchUrl(title) + '" class="btn btn-primary btn-lg">' + C.icon("play") + ' Watch</a>' + (title.videoUrl ? ('<a href="' + title.videoUrl + '" class="btn btn-secondary" download="' + (title.slug || title.id) + '.mp4">Download</a>') : '') +
        '<button type="button" class="btn btn-secondary" id="list-btn">' + (inList ? C.icon("check") + " In My List" : C.icon("plus") + " My List") + '</button>' +
        '<button type="button" class="btn btn-ghost" id="fav-btn">' + (fav ? C.icon("heartFilled") : C.icon("heart")) + ' Favorite</button></div></div></div></div>' +
        '<div class="container"><section class="section"><h2 class="section-title" style="margin-bottom:var(--space-4)">Episodes</h2>' +
        '<div class="season-selector" id="season-sel">' + seasonBtns + '</div><div class="episode-list" id="ep-list">' + renderEpisodes(1) + '</div></section></div>';
      document.getElementById("season-sel").addEventListener("click", function (e) {
        var btn = e.target.closest(".season-btn");
        if (!btn) return;
        document.querySelectorAll(".season-btn").forEach(function (b) { b.classList.remove("is-active"); });
        btn.classList.add("is-active");
        document.getElementById("ep-list").innerHTML = renderEpisodes(Number(btn.getAttribute("data-season")));
      });
      document.getElementById("list-btn").addEventListener("click", function () {
        var now = S.toggleMyList(title.id);
        document.getElementById("list-btn").innerHTML = now ? C.icon("check") + " In My List" : C.icon("plus") + " My List";
        C.showToast(now ? "Added to My List" : "Removed from My List");
      });
      document.getElementById("fav-btn").addEventListener("click", function () {
        var now = S.toggleFavorite(title.id);
        document.getElementById("fav-btn").innerHTML = (now ? C.icon("heartFilled") : C.icon("heart")) + " Favorite";
        C.showToast(now ? "Added to favorites" : "Removed from favorites");
      });
    }
  </script>
</body>
</html>
