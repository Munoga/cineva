<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page" id="main">
    <div id="details-root"></div>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var D = window.CinevaData;
    var S = window.CinevaStorage;
    var C = window.CinevaComponents;
    var id = new URLSearchParams(location.search).get("id");
    var title = D.getTitleById(id);
    var root = document.getElementById("details-root");
    if (!title) {
      root.innerHTML = '<div class="container"><div class="not-found"><div class="code">404</div><h1>Title not found</h1><a href="../index.html" class="btn btn-primary">Home</a></div></div>';
    } else {
      C.recordView(title.id);
      document.title = title.title + " – Cineva";
      var inList = S.isInMyList(title.id);
      var fav = S.isFavorite(title.id);
      var similar = D.getSimilar(title, 8);
      root.innerHTML =
        '<div class="details-hero"><div class="details-backdrop"><img src="' + title.backdrop + '" alt="" onerror="this.style.display=\'none\'"><div class="details-backdrop-overlay"></div></div>' +
        '<div class="container details-content"><div class="details-poster"><img src="' + title.poster + '" alt="' + C.escapeHtml(title.title) + '" onerror="this.style.opacity=0.3"></div>' +
        '<div class="details-info"><h1>' + C.escapeHtml(title.title) + '</h1>' +
        '<div class="details-meta"><span>' + title.year + '</span><span>' + (title.runtime ? title.runtime + " min" : "") + '</span><span>' + (title.ageRating || "") + '</span>' +
        '<span class="movie-card-rating">' + C.icon("star") + " " + title.rating.toFixed(1) + '</span></div>' +
        '<div class="tag-list" style="margin-bottom:var(--space-4)">' + title.genres.map(function(g){ return '<span class="badge">' + C.genreName(g) + '</span>'; }).join("") + '</div>' +
        '<p class="details-synopsis">' + C.escapeHtml(title.synopsis) + '</p>' +
        '<p class="text-secondary" style="font-size:var(--text-sm);margin-bottom:var(--space-4)"><strong>Director:</strong> ' + C.escapeHtml(title.director) + '</p>' +
        '<div class="details-actions">' +
        '<a href="' + C.watchUrl(title) + '" class="btn btn-primary btn-lg">' + C.icon("play") + ' Watch Now</a>' + (title.videoUrl ? ('<a href="' + title.videoUrl + '" class="btn btn-secondary btn-lg" download="' + (title.slug || title.id) + '.mp4">Download</a>') : '') +
        '<button type="button" class="btn btn-secondary" id="list-btn">' + (inList ? C.icon("check") + " In My List" : C.icon("plus") + " My List") + '</button>' +
        '<button type="button" class="btn btn-ghost" id="fav-btn">' + (fav ? C.icon("heartFilled") : C.icon("heart")) + ' Favorite</button>' +
        '</div></div></div></div>' +
        '<div class="container"><section class="section"><h2 class="section-title" style="margin-bottom:var(--space-4)">Cast</h2><div class="cast-grid">' +
        title.cast.map(function(c){ return '<div class="cast-card"><div class="cast-card-photo" style="background:var(--color-bg-surface);display:flex;align-items:center;justify-content:center;font-size:var(--text-2xl);color:var(--color-gray-600)">' + c.charAt(0) + '</div><h4>' + C.escapeHtml(c) + '</h4></div>'; }).join("") +
        '</div></section>' +
        (similar.length ? '<section class="section"><h2 class="section-title" style="margin-bottom:var(--space-4)">Similar Titles</h2><div class="carousel"><div class="carousel-track" id="similar-track"></div></div></section>' : "") +
        '</div>';
      document.getElementById("list-btn").addEventListener("click", function () {
        if (!S.isSignedIn()) {
          if (window.CinevaApp && window.CinevaApp.openSignInModal) window.CinevaApp.openSignInModal("Sign in to add to your Watchlist / My List.");
          else C.showToast("Please sign in to add to My List");
          return;
        }
        var now = S.toggleMyList(title.id);
        if (S.syncListCounts) S.syncListCounts();
        document.getElementById("list-btn").innerHTML = now ? C.icon("check") + " In My List" : C.icon("plus") + " My List";
        C.showToast(now ? "Added to My List" : "Removed from My List");
      });
      document.getElementById("fav-btn").addEventListener("click", function () {
        if (!S.isSignedIn()) {
          if (S.recordMovieLike) S.recordMovieLike(title.id, title.vj || null);
          C.showToast("Liked! Sign in to save this to your Favourites.", 3200);
          return;
        }
        var now = S.toggleFavorite(title.id);
        if (S.syncListCounts) S.syncListCounts();
        if (now && S.recordMovieLike) S.recordMovieLike(title.id, title.vj || null);
        document.getElementById("fav-btn").innerHTML = (now ? C.icon("heartFilled") : C.icon("heart")) + " Favorite";
        C.showToast(now ? "Added to favorites" : "Removed from favorites");
      });
      var dlLink = document.querySelector('a[download]');
      if (dlLink) {
        dlLink.addEventListener("click", function () {
          if (S.recordMovieDownload) S.recordMovieDownload(title.id, title.vj || null);
        });
      }
      var track = document.getElementById("similar-track");
      if (track) similar.forEach(function (t) { track.appendChild(C.createMovieCard(t)); });
    }
  </script>
</body>
</html>
