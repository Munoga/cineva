<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Series – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <header class="page-header">
        <h1>TV Series</h1>
        <p>Binge-worthy series across drama, sci-fi, fantasy, and more.</p>
      </header>
      <div class="filter-bar">
        <div class="filter-group">
          <label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="popularity">Popularity</option>
            <option value="rating">Highest rated</option>
            <option value="newest">Newest</option>
            <option value="title">A–Z</option>
          </select>
        </div>
      </div>
      <p class="results-count" id="results-count"></p>
      <div class="card-grid" id="grid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    window.CinevaApp.initApp();
    var D = window.CinevaData;
    var C = window.CinevaComponents;
    function apply() {
      var results = D.filterTitles({ type: "series", sort: document.getElementById("f-sort").value });
      document.getElementById("results-count").textContent = results.length + " series";
      C.renderCardGrid(document.getElementById("grid"), results);
    }
    document.getElementById("f-sort").addEventListener("change", apply);
    apply();
  </script>
</body>
</html>
