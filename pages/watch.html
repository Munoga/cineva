<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch – Cineva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="player-page">
  <div class="player-header">
    <a href="#" id="back-link" class="btn btn-ghost"></a>
    <h1 id="player-title" style="font-size:var(--text-lg);margin:0;flex:1;text-align:center" class="truncate"></h1>
    <span style="width:100px"></span>
  </div>
  <div class="player-wrapper" id="player-wrap">
    <video id="main-video" controls playsinline preload="metadata" style="width:100%;height:100%;background:#000;display:none;"></video>
    <div class="player-unavailable" id="unavailable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="64" height="64"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
      <h2>Loading player…</h2>
      <p id="unavailable-msg">Preparing video source.</p>
      <a href="#" id="back-details" class="btn btn-primary">Back to details</a>
    </div>
  </div>
  <div class="container" style="padding-top:var(--space-4);display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center" id="player-actions">
    <a href="#" id="download-btn" class="btn btn-secondary" download style="display:none">Download video</a>
    <span class="text-muted" style="font-size:var(--text-sm)" id="video-note">Sample demo video from public test sources. For portfolio demonstration only.</span>
  </div>
  <div class="container" style="padding-top:var(--space-8);padding-bottom:var(--space-12)">
    <h2 class="section-title" style="margin-bottom:var(--space-4)">Related</h2>
    <div class="carousel"><div class="carousel-track" id="related"></div></div>
  </div>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/components.js"></script>
  <script>
    var D = window.CinevaData, S = window.CinevaStorage, C = window.CinevaComponents;
    var id = new URLSearchParams(location.search).get("id");
    var title = D.getTitleById(id);
    if (!title) {
      document.getElementById("player-title").textContent = "Not found";
      document.getElementById("back-link").href = "../index.html";
      document.getElementById("back-link").innerHTML = C.icon("chevronLeft") + " Home";
    } else {
      document.title = "Watch " + title.title + " – Cineva";
      document.getElementById("player-title").textContent = title.title;
      var details = C.detailsUrl(title);
      document.getElementById("back-link").href = details;
      document.getElementById("back-link").innerHTML = C.icon("chevronLeft") + " Back";
      document.getElementById("back-details").href = details;
      C.recordView(title.id);
      S.addToHistory(title.id);
      var existing = S.getProgressFor(title.id);
      var video = document.getElementById("main-video");
      var unavail = document.getElementById("unavailable");
      var dl = document.getElementById("download-btn");
      if (title.videoUrl) {
        video.src = title.videoUrl;
        video.style.display = "block";
        unavail.style.display = "none";
        dl.href = title.videoUrl;
        dl.setAttribute("download", (title.slug || title.id) + ".mp4");
        dl.textContent = "Download video";
        dl.style.display = "inline-flex";
        video.addEventListener("canplay", function () {
          dl.style.display = "inline-flex";
          dl.classList.add("btn-primary");
          dl.classList.remove("btn-secondary");
        });
        if (existing && existing.currentTime) {
          video.addEventListener("loadedmetadata", function () {
            try { video.currentTime = existing.currentTime; } catch (e) {}
          });
        }
        video.addEventListener("timeupdate", function () {
          if (video.duration) S.setProgress(title.id, (video.currentTime / video.duration) * 100, video.currentTime);
        });
      } else {
        document.getElementById("unavailable-msg").textContent = "No video source is configured for this title.";
        if (!existing) S.setProgress(title.id, 15, 0);
      }
      var similar = D.getSimilar(title, 10);
      var track = document.getElementById("related");
      similar.forEach(function (t) { track.appendChild(C.createMovieCard(t)); });
    }
  </script>
</body>
</html>
